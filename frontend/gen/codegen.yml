overwrite: true
schema:
  - http://localhost:5173/graphql:
      headers:
        Authorization: Bearer ${TOKEN}
generates:
  # Generate types + RTK Query hooks (excluding links)
  ../src/App/api/generated/graphql.ts:
    documents:
      - "../**/*.graphql"
    plugins:
      - typescript
      - add:
          content: >
            /* eslint-disable */
            /**
             *
             * THIS FILE IS AUTOGENERATED, DO NOT EDIT IT!
             *
             * instead, edit one of the `.graphql` files in this project and run
             *
             * npm run graphql-codegen
             *
             * for this file to be re-created
             */
            // @ts-nocheck
      - typescript-operations
      - typescript-rtk-query:
          importBaseApiFrom: "@ynput/ayon-frontend-shared/api"
          importBaseApiAlternateName: "api"
  ./graphql.schema.json:
    plugins:
      - "introspection"
